[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["vendor/librespot"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["spotify-rs contributors"]

[workspace.dependencies]
spotify-core = { path = "crates/spotify-core" }
spotify-playback = { path = "crates/spotify-playback" }
spotify-ui = { path = "crates/spotify-ui" }
spotify-host = { path = "crates/spotify-host" }

librespot-core = { path = "vendor/librespot/core" }
librespot-protocol = { path = "vendor/librespot/protocol" }
librespot-playback = { path = "vendor/librespot/playback" }
librespot-audio = { path = "vendor/librespot/audio" }
librespot-metadata = { path = "vendor/librespot/metadata" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "gzip", "query", "form"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
serde_urlencoded = "0.7"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
once_cell = "1"
# The glow (OpenGL) renderer keeps the footprint far below the wgpu/Vulkan
# one, which matters for a 2D interface.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
